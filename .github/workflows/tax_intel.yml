name: Tax Intelligence System

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:          # allow manual trigger

permissions:
  contents: write             # needed to commit state/seen_items.json

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout (full history so we can push back the state file)
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------------------------------------
      # 3. Cache pip dependencies
      # -----------------------------------------------------------------------
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      # -----------------------------------------------------------------------
      # 4. Cache SQLite state between runs (fast path; JSON backup is fallback)
      # -----------------------------------------------------------------------
      - name: Cache SQLite state
        uses: actions/cache@v4
        with:
          path: state/seen_items.db
          key: sqlite-state-${{ github.run_id }}
          restore-keys: sqlite-state-

      # -----------------------------------------------------------------------
      # 5. Install Python dependencies (no playwright)
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # 6. Create required directories
      # -----------------------------------------------------------------------
      - name: Prepare directories
        run: |
          mkdir -p state logs

      # -----------------------------------------------------------------------
      # 7. Run the main script
      # -----------------------------------------------------------------------
      - name: Run Tax Intelligence System
        env:
          TELEGRAM_BOT_TOKEN:         ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_NOTIF:     ${{ secrets.TELEGRAM_CHANNEL_NOTIF }}
          TELEGRAM_CHANNEL_CIRCULAR:  ${{ secrets.TELEGRAM_CHANNEL_CIRCULAR }}
          TELEGRAM_CHANNEL_CASELAW:   ${{ secrets.TELEGRAM_CHANNEL_CASELAW }}
          TELEGRAM_CHANNEL_IMPORTANT: ${{ secrets.TELEGRAM_CHANNEL_IMPORTANT }}
          GOOGLE_SHEET_ID:            ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS:  ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python main.py

      # -----------------------------------------------------------------------
      # 8. Commit state/seen_items.json back so dedup persists across runs
      #    even when the cache misses.
      # -----------------------------------------------------------------------
      - name: Commit state backup
        if: always()    # run even if main.py had errors
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen_items.json || true
          # Only commit if there's something new
          git diff --cached --quiet || git commit -m "chore: update seen_items state [skip ci]"
          git push || true
